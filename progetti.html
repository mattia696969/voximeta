<script src="https://cdn.jsdelivr.net/npm/@mux/mux-player"></script>
<script src="main.js"></script>
<script>
(function(){
  "use strict";

  var lightbox = document.getElementById("lightbox");
  var inner = document.getElementById("lightboxInner");
  var caption = document.getElementById("lightboxCaption");
  var closeBtn = document.getElementById("lightboxClose");
  var sheet = document.getElementById("folderSheet");
  var sheetGrid = document.getElementById("folderSheetGrid");
  var sheetTitle = document.getElementById("folderSheetTitle");
  var sheetMeta = document.getElementById("folderSheetMeta");
  var sheetClose = document.getElementById("folderSheetClose");
  var canHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

  function lockScroll(){ document.body.style.overflow = "hidden"; }
  function unlockScroll(){
    if(!lightbox.classList.contains("open") && !sheet.classList.contains("open")) document.body.style.overflow = "";
  }

  function playerHTML(item, opts){
    if(item.dataset.videoSrc){
      return '<video src="' + item.dataset.videoSrc + '"' + opts.attrs + ' playsinline></video>';
    }
    return '<mux-player disable-cookies disable-tracking playback-id="' + item.dataset.videoId + '" stream-type="on-demand"' + opts.attrs + '></mux-player>';
  }

  /* ---------- Lightbox: full screen with audio; case studies also
     show their write-up underneath. ---------- */
  function open(item){
    var wide = item.dataset.wide === "true";
    inner.className = "lightbox-inner" + (wide ? " wide" : "");
    inner.innerHTML = playerHTML(item, {attrs: item.dataset.videoSrc ? " autoplay controls" : " autoplay preload=\"auto\""});
    if(item.dataset.case){
      caption.innerHTML =
        '<p class="lc-sub">' + item.querySelector(".cs-sub").innerHTML + '</p>' +
        '<h3 class="lc-title">' + item.querySelector(".cs-title").innerHTML + '</h3>' +
        '<p class="lc-desc">' + item.querySelector(".cs-desc").innerHTML + '</p>' +
        '<p class="lc-tag">' + item.querySelector(".cs-tag").innerHTML + '</p>';
      caption.hidden = false;
      lightbox.classList.add("has-caption");
    } else {
      caption.hidden = true;
      caption.innerHTML = "";
      lightbox.classList.remove("has-caption");
    }
    lightbox.scrollTop = 0;
    lightbox.classList.add("open");
    lockScroll();
  }
  function close(){
    lightbox.classList.remove("open");
    inner.innerHTML = "";
    unlockScroll();
  }
  closeBtn.addEventListener("click", close);
  lightbox.addEventListener("click", function(e){ if(e.target === lightbox || e.target.classList.contains("lightbox-stage")) close(); });

  /* ---------- Hover (desktop): the video plays muted, but under a
     mosaic, so it can only really be watched full screen. ---------- */
  function startPreview(tile, item){
    if(tile.querySelector(".vx-live")) return;
    var wrap = document.createElement("span");
    wrap.className = "vx-live";
    wrap.innerHTML = playerHTML(item, {attrs: " muted loop autoplay"});
    tile.appendChild(wrap);
    var media = wrap.firstChild;
    if(media.play){ var p = media.play(); if(p && p.catch) p.catch(function(){}); }
    requestAnimationFrame(function(){ wrap.classList.add("on"); });
  }
  function stopPreview(tile){
    var wrap = tile.querySelector(".vx-live");
    if(wrap) wrap.remove();
  }

  /* ---------- Client folders ---------- */
  function openFolder(folder){
    var items = folder.querySelectorAll(".folder-items > span");
    sheetTitle.textContent = folder.dataset.name;
    sheetMeta.textContent = folder.dataset.meta + " · " + items.length + " video";
    sheetGrid.innerHTML = "";
    sheetGrid.style.setProperty("--cols", Math.min(items.length, 4));
    items.forEach(function(item, i){
      var tile = document.createElement("button");
      tile.type = "button";
      tile.className = "vx-tile" + (item.dataset.case ? " is-case" : "");
      tile.style.setProperty("--i", i);
      tile.setAttribute("aria-label", (item.dataset.case || ("Video di " + folder.dataset.name)) + ", guarda a schermo intero");
      var img = document.createElement("img");
      img.className = "vx-poster";
      img.src = item.dataset.thumb;
      img.alt = "";
      tile.appendChild(img);
      if(item.dataset.case){
        var label = document.createElement("span");
        label.className = "vx-case-label";
        label.textContent = item.dataset.case;
        tile.appendChild(label);
      }
      tile.addEventListener("click", function(){ stopPreview(tile); open(item); });
      if(canHover){
        tile.addEventListener("mouseenter", function(){ startPreview(tile, item); });
        tile.addEventListener("mouseleave", function(){ stopPreview(tile); });
      }
      sheetGrid.appendChild(tile);
    });
    sheet.classList.add("open");
    sheet.setAttribute("aria-hidden", "false");
    lockScroll();
    sheetClose.focus({preventScroll:true});
  }
  function closeFolder(){
    sheet.classList.remove("open");
    sheet.setAttribute("aria-hidden", "true");
    sheetGrid.querySelectorAll(".vx-tile").forEach(stopPreview);
    unlockScroll();
  }
  document.querySelectorAll(".folder").forEach(function(folder){
    folder.addEventListener("click", function(){ openFolder(folder); });
  });
  sheetClose.addEventListener("click", closeFolder);
  sheet.addEventListener("click", function(e){ if(e.target === sheet) closeFolder(); });

  document.addEventListener("keydown", function(e){
    if(e.key !== "Escape") return;
    if(lightbox.classList.contains("open")) close();
    else if(sheet.classList.contains("open")) closeFolder();
  });
})();
</script>
